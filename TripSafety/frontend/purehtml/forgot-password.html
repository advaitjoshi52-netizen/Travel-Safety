<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TripSafety - Forgot Password</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0ea5a4,
                    #16a34a
                );
        }

        .container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 38px;
            border-radius: 22px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.20);
        }

        .logo {
            text-align: center;
            font-size: 25px;
            font-weight: 800;
            color: #2563eb;
            margin-bottom: 25px;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: #eff6ff;

            font-size: 30px;
        }

        h1 {
            text-align: center;
            margin: 0;

            color: #111827;
            font-size: 27px;
        }

        .description {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
            margin: 10px 0 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #374151;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 15px;

            border: 1px solid #d1d5db;
            border-radius: 10px;

            background: #f9fafb;

            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 4px
                rgba(37,99,235,0.10);
        }

        .form-group {
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            height: 50px;

            border: none;
            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #1d4ed8
                );

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        .message {
            margin-top: 15px;
            padding: 12px;

            border-radius: 9px;

            text-align: center;

            font-size: 13px;

            display: none;
        }

        .success {
            display: block;
            background: #f0fdf4;
            color: #15803d;
        }

        .error {
            display: block;
            background: #fef2f2;
            color: #dc2626;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 22px;

            color: #2563eb;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            🛡️ TripSafety
        </div>

        <div class="icon">
            🔑
        </div>

        <h1>
            Forgot Password?
        </h1>

        <p class="description">
            Enter your registered email address and
            we'll help you reset your password.
        </p>


        <form id="forgotPasswordForm">

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your registered email"
                    required
                >

            </div>


            <button
                type="submit"
                id="resetBtn"
            >
                Reset Password
            </button>

        </form>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="index.html"
            class="back"
        >
            ← Back to Login
        </a>

    </div>

</div>




</body>

</html>
