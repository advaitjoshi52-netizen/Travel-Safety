<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TripSafety - Reset Password</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #0891b2,
                    #16a34a
                );
        }

        .card {
            width: 100%;
            max-width: 440px;

            padding: 42px;

            background: white;

            border-radius: 22px;

            box-shadow:
                0 25px 60px
                rgba(0, 0, 0, 0.18);
        }

        .logo {
            width: 60px;
            height: 60px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background: #eff6ff;

            font-size: 30px;
        }

        h1 {
            text-align: center;

            color: #111827;

            font-size: 30px;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;

            color: #64748b;

            font-size: 14px;

            line-height: 1.5;

            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #1f2937;

            font-size: 13px;

            font-weight: 700;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 50px;

            padding: 0 45px 0 15px;

            border: 1px solid #d7dfeb;

            border-radius: 11px;

            background: #f8fafc;

            outline: none;

            font-size: 14px;

            color: #111827;
        }

        input:focus {
            background: white;

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }

        .toggle {
            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 16px;
        }

        .password-info {
            margin-top: 7px;

            color: #94a3b8;

            font-size: 11px;
        }

        button[type="submit"] {
            width: 100%;
            height: 50px;

            border: none;

            border-radius: 11px;

            background: #2563eb;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        button[type="submit"]:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        .message {
            display: none;

            padding: 12px;

            margin-bottom: 18px;

            border-radius: 9px;

            font-size: 13px;

            line-height: 1.4;
        }

        .message.show {
            display: block;
        }

        .message.error {
            color: #b91c1c;

            background: #fef2f2;

            border: 1px solid #fecaca;
        }

        .message.success {
            color: #15803d;

            background: #f0fdf4;

            border: 1px solid #bbf7d0;
        }

        .back-login {
            display: block;

            margin-top: 22px;

            text-align: center;

            color: #2563eb;

            font-size: 13px;

            font-weight: 600;

            text-decoration: none;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;

            color: #64748b;

            font-size: 14px;
        }

        @media (max-width: 500px) {

            .card {
                padding: 30px 22px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>
</head>


<body>

    <div class="card">

        <div class="logo">
            🔐
        </div>

        <h1>
            Reset Password
        </h1>

        <p class="subtitle">
            Create a new password for your
            TripSafety account.
        </p>


        <div
            id="pageMessage"
            class="message"
        ></div>


        <div
            id="loadingMessage"
            class="loading"
        >
            Checking reset link...
        </div>


        <form
            id="resetPasswordForm"
            style="display: none;"
        >

            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        onclick="togglePassword('newPassword', this)"
                    >
                        👁️
                    </button>

                </div>

                <div class="password-info">
                    Password must contain at least 6 characters.
                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="input-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm new password"
                        minlength="6"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle"
                        onclick="togglePassword('confirmPassword', this)"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <button
                type="submit"
                id="resetBtn"
            >
                Reset Password
            </button>

        </form>


        <a
            href="index.html"
            class="back-login"
        >
            ← Back to Login
        </a>

    </div>


    

</body>

</html>
