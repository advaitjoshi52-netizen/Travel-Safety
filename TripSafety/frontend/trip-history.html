<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Trip History - TripSafety</title>


    <!-- GLOBAL CSS -->

    <link
        rel="stylesheet"
        href="css/global.css"
    >


    <style>

        /* =========================================
           PAGE
        ========================================= */

        .history-page {
            padding: 30px;
        }

        .history-container {
            max-width: 1150px;
            margin: 0 auto;
        }


        /* =========================================
           HEADER
        ========================================= */

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 25px;
        }

        .history-title h1 {
            margin: 0;
            color: #172033;
            font-size: 30px;
        }

        .history-title p {
            margin: 7px 0 0;
            color: #718096;
            font-size: 14px;
        }


        /* =========================================
           FILTER BAR
        ========================================= */

        .history-toolbar {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.05);
        }


        .filter-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }


        .filter-btn {
            border: 1px solid #e5e7eb;
            background: #f8fafc;
            color: #475569;

            padding: 9px 15px;

            border-radius: 8px;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }


        .filter-btn:hover {
            background: #eff6ff;
            color: #2563eb;
            border-color: #bfdbfe;
        }


        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }


        .search-box {
            min-width: 220px;
        }


        .search-box input {
            width: 100%;

            box-sizing: border-box;

            padding: 10px 13px;

            border: 1px solid #e5e7eb;
            border-radius: 8px;

            outline: none;

            font-size: 12px;
        }


        .search-box input:focus {
            border-color: #2563eb;
            box-shadow:
                0 0 0 3px rgba(37,99,235,0.10);
        }


        /* =========================================
           SUMMARY
        ========================================= */

        .history-summary {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 14px;

            margin-bottom: 20px;
        }


        .summary-card {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 12px;

            padding: 16px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.04);
        }


        .summary-label {
            color: #718096;
            font-size: 11px;
            margin-bottom: 6px;
        }


        .summary-value {
            color: #172033;
            font-size: 22px;
            font-weight: 700;
        }


        /* =========================================
           TRIP CARD
        ========================================= */

        .history-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 15px;

            padding: 20px;

            margin-bottom: 16px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.06);

            transition:
                transform 0.2s,
                box-shadow 0.2s;
        }


        .history-card:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 22px rgba(0,0,0,0.08);
        }


        /* =========================================
           TRIP HEADER
        ========================================= */

        .trip-header {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            gap: 15px;

            margin-bottom: 16px;
        }


        .trip-title-area {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .trip-icon {

            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                #eff6ff;

            border-radius: 10px;

            font-size: 20px;
        }


        .trip-header h2 {

            margin: 0;

            font-size: 18px;

            color: #172033;
        }


        .trip-subtitle {

            margin-top: 4px;

            color: #94a3b8;

            font-size: 11px;
        }


        /* =========================================
           STATUS
        ========================================= */

        .status {

            padding:
                6px 12px;

            border-radius:
                20px;

            font-size:
                10px;

            font-weight:
                700;

            white-space:
                nowrap;
        }


        .status-active {

            background:
                #dcfce7;

            color:
                #15803d;
        }


        .status-upcoming {

            background:
                #fef3c7;

            color:
                #b45309;
        }


        .status-completed {

            background:
                #dbeafe;

            color:
                #1d4ed8;
        }


        .status-cancelled {

            background:
                #fee2e2;

            color:
                #dc2626;
        }


        /* =========================================
           ROUTE
        ========================================= */

        .trip-route {

            display: grid;

            grid-template-columns:
                1fr 55px 1fr;

            align-items:
                center;

            gap: 10px;

            background:
                #f8fafc;

            border:
                1px solid #eef2f7;

            border-radius:
                10px;

            padding:
                16px;

            margin-bottom:
                15px;
        }


        .route-label {

            color:
                #94a3b8;

            font-size:
                10px;

            text-transform:
                uppercase;

            margin-bottom:
                5px;
        }


        .route-value {

            color:
                #172033;

            font-size:
                14px;

            font-weight:
                700;

            word-break:
                break-word;
        }


        .route-arrow {

            text-align:
                center;

            font-size:
                22px;

            color:
                #2563eb;
        }


        /* =========================================
           DETAILS
        ========================================= */

        .trip-details {

            display:
                grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap:
                10px;
        }


        .detail-box {

            background:
                #f8fafc;

            border-radius:
                9px;

            padding:
                12px;
        }


        .detail-label {

            display:
                block;

            color:
                #94a3b8;

            font-size:
                10px;

            margin-bottom:
                5px;
        }


        .detail-value {

            color:
                #263247;

            font-size:
                12px;

            font-weight:
                700;

            word-break:
                break-word;
        }


        /* =========================================
           NOTES
        ========================================= */

        .trip-notes {

            margin-top:
                14px;

            padding:
                12px 14px;

            background:
                #f8fafc;

            border-left:
                4px solid #2563eb;

            border-radius:
                6px;

            color:
                #475569;

            font-size:
                12px;
        }


        /* =========================================
           ACTIONS
        ========================================= */

        .trip-actions {

            display:
                flex;

            justify-content:
                flex-end;

            gap:
                9px;

            margin-top:
                16px;

            padding-top:
                15px;

            border-top:
                1px solid #eef2f7;
        }


        .trip-btn {

            display:
                inline-flex;

            align-items:
                center;

            justify-content:
                center;

            text-decoration:
                none;

            border:
                none;

            border-radius:
                8px;

            padding:
                9px 15px;

            font-size:
                11px;

            font-weight:
                700;

            cursor:
                pointer;
        }


        .primary-trip-btn {

            background:
                #2563eb;

            color:
                white;
        }


        .secondary-trip-btn {

            background:
                #eef2ff;

            color:
                #4338ca;
        }


        .trip-btn:hover {

            opacity:
                0.9;
        }


        /* =========================================
           EMPTY / LOADING / ERROR
        ========================================= */

        .loading-state,
        .empty-state,
        .error-state {

            background:
                white;

            border:
                1px solid #e5e7eb;

            border-radius:
                15px;

            padding:
                55px 20px;

            text-align:
                center;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.05);
        }


        .state-icon {

            font-size:
                42px;

            margin-bottom:
                12px;
        }


        .empty-state h2,
        .error-state h2 {

            margin:
                0 0 7px;

            color:
                #172033;
        }


        .empty-state p,
        .error-state p {

            margin:
                0;

            color:
                #718096;

            font-size:
                13px;
        }


        .register-link {

            display:
                inline-block;

            margin-top:
                16px;

            padding:
                10px 16px;

            background:
                #2563eb;

            color:
                white;

            text-decoration:
                none;

            border-radius:
                8px;

            font-size:
                12px;

            font-weight:
                700;
        }


        .error-state {

            border-color:
                #fecaca;
        }


        .error-state h2 {

            color:
                #dc2626;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 900px) {

            .history-summary {

                grid-template-columns:
                    repeat(2, 1fr);
            }


            .trip-details {

                grid-template-columns:
                    repeat(2, 1fr);
            }
        }


        @media (max-width: 650px) {

            .history-page {

                padding:
                    15px;
            }


            .history-header {

                align-items:
                    flex-start;

                flex-direction:
                    column;
            }


            .history-title h1 {

                font-size:
                    24px;
            }


            .history-toolbar {

                align-items:
                    stretch;

                flex-direction:
                    column;
            }


            .search-box {

                width:
                    100%;
            }


            .trip-header {

                align-items:
                    flex-start;

                flex-direction:
                    column;
            }


            .trip-route {

                grid-template-columns:
                    1fr;

                gap:
                    8px;
            }


            .route-arrow {

                transform:
                    rotate(90deg);
            }


            .trip-details {

                grid-template-columns:
                    1fr;
            }


            .trip-actions {

                justify-content:
                    stretch;

                flex-direction:
                    column;
            }


            .trip-btn {

                width:
                    100%;
            }
        }

    </style>

</head>


<body>


<!-- =========================================
     SIDEBAR
========================================= -->

<aside class="sidebar">

    <div class="logo">
        🛡️ TripSafety
    </div>


    <nav>

        <a href="dashboard.html">
            🏠 Dashboard
        </a>


        <a href="register-trip.html">
            ➕ Pre-Register Trip
        </a>


        <a href="tracking.html">
            📍 Live Tracking
        </a>


        <a
            href="trip-history.html"
            class="active"
        >
            🕘 Trip History
        </a>


        <a href="emergency-contacts.html">
            👥 Emergency Contacts
        </a>


        <a href="notifications.html">
            🔔 Notifications
        </a>


        <a href="settings.html">
            ⚙️ Settings
        </a>

    </nav>


    <button
        id="logoutBtn"
        class="logout-btn"
    >
        🚪 Logout
    </button>

</aside>



<!-- =========================================
     MAIN
========================================= -->

<main class="main-content">


    <div class="history-page">


        <div class="history-container">


            <!-- HEADER -->

            <div class="history-header">

                <div class="history-title">

                    <h1>
                        🕘 Trip History
                    </h1>

                    <p>
                        View and manage all your journeys.
                    </p>

                </div>

            </div>



            <!-- =================================
                 SUMMARY
            ================================== -->

            <div class="history-summary">

                <div class="summary-card">

                    <div class="summary-label">
                        TOTAL TRIPS
                    </div>

                    <div
                        id="totalTrips"
                        class="summary-value"
                    >
                        0
                    </div>

                </div>


                <div class="summary-card">

                    <div class="summary-label">
                        UPCOMING
                    </div>

                    <div
                        id="upcomingTrips"
                        class="summary-value"
                    >
                        0
                    </div>

                </div>


                <div class="summary-card">

                    <div class="summary-label">
                        ACTIVE
                    </div>

                    <div
                        id="activeTrips"
                        class="summary-value"
                    >
                        0
                    </div>

                </div>


                <div class="summary-card">

                    <div class="summary-label">
                        COMPLETED
                    </div>

                    <div
                        id="completedTrips"
                        class="summary-value"
                    >
                        0
                    </div>

                </div>

            </div>



            <!-- =================================
                 TOOLBAR
            ================================== -->

            <div class="history-toolbar">


                <div class="filter-buttons">

                    <button
                        class="filter-btn active"
                        data-filter="all"
                    >
                        All
                    </button>


                    <button
                        class="filter-btn"
                        data-filter="upcoming"
                    >
                        Upcoming
                    </button>


                    <button
                        class="filter-btn"
                        data-filter="active"
                    >
                        Active
                    </button>


                    <button
                        class="filter-btn"
                        data-filter="completed"
                    >
                        Completed
                    </button>

                </div>


                <div class="search-box">

                    <input
                        type="text"
                        id="tripSearch"
                        placeholder="🔍 Search trips..."
                    >

                </div>

            </div>



            <!-- =================================
                 TRIPS
            ================================== -->

            <div id="tripsList">

                <div class="loading-state">

                    <div class="state-icon">
                        🔄
                    </div>

                    <h2>
                        Loading trips...
                    </h2>

                    <p>
                        Please wait.
                    </p>

                </div>

            </div>


        </div>

    </div>


</main>



<script src="js/trip-history.js"></script>


</body>

</html>
