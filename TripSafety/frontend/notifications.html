<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notifications - TripSafety</title>

    <link
        rel="stylesheet"
        href="css/global.css"
    >


    <style>

        /* =========================================
           PAGE
        ========================================= */

        .notifications-page {
            padding: 30px;
        }

        .notifications-container {
            max-width: 1050px;
            margin: 0 auto;
        }


        /* =========================================
           HEADER
        ========================================= */

        .notifications-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 24px;
        }

        .notifications-title h1 {
            margin: 0;
            color: #172033;
            font-size: 30px;
        }

        .notifications-title p {
            margin: 6px 0 0;
            color: #718096;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 9px;
        }

        .header-btn {
            border: none;
            border-radius: 8px;
            padding: 10px 15px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .refresh-btn {
            background: #f1f5f9;
            color: #475569;
        }

        .mark-all-btn {
            background: #2563eb;
            color: white;
        }

        .header-btn:hover {
            opacity: 0.88;
        }


        /* =========================================
           SUMMARY
        ========================================= */

        .notification-summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 13px;
            padding: 17px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.05);
        }

        .summary-label {
            color: #718096;
            font-size: 10px;
            margin-bottom: 6px;
        }

        .summary-value {
            color: #172033;
            font-size: 23px;
            font-weight: 700;
        }


        /* =========================================
           TOOLBAR
        ========================================= */

        .notification-toolbar {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 13px;
            padding: 13px;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;

            margin-bottom: 16px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.04);
        }

        .filter-buttons {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }

        .filter-btn {
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #475569;

            padding: 8px 13px;

            border-radius: 8px;

            font-size: 11px;
            font-weight: 700;

            cursor: pointer;
        }

        .filter-btn:hover {
            border-color: #bfdbfe;
            color: #2563eb;
        }

        .filter-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }

        .search-box {
            width: 230px;
        }

        .search-box input {
            width: 100%;
            box-sizing: border-box;

            padding: 9px 12px;

            border: 1px solid #dbe2ea;
            border-radius: 8px;

            outline: none;

            font-size: 11px;
        }

        .search-box input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.08);
        }


        /* =========================================
           NOTIFICATION LIST
        ========================================= */

        .notifications-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }


        /* =========================================
           NOTIFICATION CARD
        ========================================= */

        .notification-card {
            position: relative;

            display: flex;
            align-items: center;

            gap: 14px;

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 12px;

            padding: 15px 16px;

            box-shadow:
                0 4px 14px rgba(0,0,0,0.04);

            transition:
                0.2s;
        }

        .notification-card:hover {
            border-color: #bfdbfe;

            box-shadow:
                0 6px 18px rgba(37,99,235,0.08);
        }


        /* UNREAD */

        .notification-card.unread {
            border-left:
                4px solid #2563eb;

            background:
                #f8fbff;
        }


        .notification-card.read {
            opacity: 0.88;
        }


        /* =========================================
           ICON
        ========================================= */

        .notification-icon {
            width: 44px;
            height: 44px;

            min-width: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eff6ff;

            font-size: 20px;
        }


        .notification-icon.sos {
            background: #fee2e2;
        }

        .notification-icon.success {
            background: #dcfce7;
        }

        .notification-icon.warning {
            background: #fef3c7;
        }


        /* =========================================
           CONTENT
        ========================================= */

        .notification-content {
            flex: 1;
            min-width: 0;
        }

        .notification-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .notification-title {
            color: #172033;
            font-size: 13px;
            font-weight: 700;
        }

        .unread-dot {
            width: 7px;
            height: 7px;

            border-radius: 50%;

            background: #2563eb;
        }

        .notification-message {
            color: #64748b;
            font-size: 11px;
            line-height: 1.5;
        }

        .notification-time {
            margin-top: 6px;
            color: #94a3b8;
            font-size: 9px;
        }


        /* =========================================
           ACTION
        ========================================= */

        .notification-action {
            flex-shrink: 0;
        }

        .mark-read-btn {
            border: none;

            background: #eff6ff;
            color: #2563eb;

            padding: 8px 11px;

            border-radius: 7px;

            font-size: 10px;
            font-weight: 700;

            cursor: pointer;
        }

        .mark-read-btn:hover {
            background: #dbeafe;
        }

        .read-label {
            color: #94a3b8;
            font-size: 10px;
            font-weight: 600;
        }


        /* =========================================
           EMPTY / LOADING / ERROR
        ========================================= */

        .notification-state {
            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 14px;

            padding: 55px 20px;

            text-align: center;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.05);
        }

        .state-icon {
            font-size: 43px;
            margin-bottom: 10px;
        }

        .notification-state h2 {
            margin: 0 0 7px;
            color: #172033;
            font-size: 18px;
        }

        .notification-state p {
            margin: 0;
            color: #718096;
            font-size: 12px;
        }


        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 800px) {

            .notification-summary {
                grid-template-columns: 1fr 1fr;
            }

            .notification-toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }
        }


        @media (max-width: 600px) {

            .notifications-page {
                padding: 15px;
            }

            .notifications-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .header-actions {
                width: 100%;
            }

            .header-btn {
                flex: 1;
            }

            .notification-summary {
                grid-template-columns: 1fr;
            }

            .notification-card {
                align-items: flex-start;
            }

            .notification-action {
                margin-left: auto;
            }

            .mark-read-btn {
                font-size: 9px;
                padding: 7px;
            }
        }

    </style>

</head>


<body>


<!-- =========================================
     SIDEBAR
========================================= -->

<aside class="sidebar">

    <div class="logo">
        🛡️ TripSafety
    </div>


    <nav>

        <a href="dashboard.html">
            🏠 Dashboard
        </a>


        <a href="register-trip.html">
            ➕ Pre-Register Trip
        </a>


        <a href="tracking.html">
            📍 Live Tracking
        </a>


        <a href="trip-history.html">
            🕘 Trip History
        </a>


        <a href="emergency-contacts.html">
            👥 Emergency Contacts
        </a>


        <a
            href="notifications.html"
            class="active"
        >
            🔔 Notifications
        </a>


        <a href="settings.html">
            ⚙️ Settings
        </a>

    </nav>


    <button
        id="logoutBtn"
        class="logout-btn"
    >
        🚪 Logout
    </button>

</aside>



<!-- =========================================
     MAIN
========================================= -->

<main class="main-content">


    <div class="notifications-page">


        <div class="notifications-container">


            <!-- HEADER -->

            <div class="notifications-header">

                <div class="notifications-title">

                    <h1>
                        🔔 Notifications
                    </h1>

                    <p>
                        View your latest TripSafety alerts and trip updates.
                    </p>

                </div>


                <div class="header-actions">

                    <button
                        id="refreshBtn"
                        class="header-btn refresh-btn"
                    >
                        🔄 Refresh
                    </button>


                    <button
                        id="markAllBtn"
                        class="header-btn mark-all-btn"
                    >
                        ✓ Mark All as Read
                    </button>

                </div>

            </div>



            <!-- SUMMARY -->

            <div class="notification-summary">


                <div class="summary-card">

                    <div class="summary-label">
                        TOTAL NOTIFICATIONS
                    </div>

                    <div
                        id="totalNotifications"
                        class="summary-value"
                    >
                        0
                    </div>

                </div>


                <div class="summary-card">

                    <div class="summary-label">
                        UNREAD
                    </div>

                    <div
                        id="unreadNotifications"
                        class="summary-value"
                    >
                        0
                    </div>

                </div>


                <div class="summary-card">

                    <div class="summary-label">
                        READ
                    </div>

                    <div
                        id="readNotifications"
                        class="summary-value"
                    >
                        0
                    </div>

                </div>

            </div>



            <!-- TOOLBAR -->

            <div class="notification-toolbar">


                <div class="filter-buttons">

                    <button
                        class="filter-btn active"
                        data-filter="all"
                    >
                        All
                    </button>


                    <button
                        class="filter-btn"
                        data-filter="unread"
                    >
                        Unread
                    </button>


                    <button
                        class="filter-btn"
                        data-filter="read"
                    >
                        Read
                    </button>

                </div>


                <div class="search-box">

                    <input
                        type="text"
                        id="notificationSearch"
                        placeholder="🔍 Search notifications..."
                    >

                </div>


            </div>



            <!-- NOTIFICATIONS -->

            <div
                id="notificationsList"
                class="notifications-list"
            >

                <div class="notification-state">

                    <div class="state-icon">
                        🔄
                    </div>

                    <h2>
                        Loading notifications...
                    </h2>

                    <p>
                        Please wait.
                    </p>

                </div>

            </div>


        </div>

    </div>


</main>



<script src="js/notifications.js"></script>


</body>

</html>
